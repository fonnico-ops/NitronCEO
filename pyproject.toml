[project]
name = "nitronceo"
version = "0.1.0"
description = "Matriz de cobrança executiva do Grupo Nitron"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "requests>=2.31"]

[project.scripts]
nitronceo = "nitronceo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
