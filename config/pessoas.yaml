# Quem responde por quê. O motor não sabe cobrar ninguém sem este arquivo.
#
# `pessoas`  -> uma ou mais pessoas por papel. Cada uma recebe a cobrança no
#               Teams e, quando o KPI pede e-mail, também na caixa dela.
#               Dois nomes num papel significa que os DOIS são cobrados, não
#               que um cobre o outro: cobrança sem dono único vira cobrança de
#               ninguém, então o papel é que é o dono, e ambos respondem por ele.
# `escalonar_para` -> para quem a cobrança sobe quando o SLA estoura.
#               Hoje tudo sobe direto para o CEO porque a hierarquia
#               intermediária não foi declarada. Se houver gerente entre a
#               pessoa e o Renato, aponte aqui — o degrau a mais é o que evita
#               que assunto operacional chegue no CEO.
#
# O `email` de cada pessoa é o mesmo usado como UPN do Microsoft 365 (Teams).

papeis:
  ceo:
    nome: CEO
    escalonar_para: null
    pessoas:
      - nome: Renato Fonseca
        email: renato.fonseca@nitron.com.br

  financeiro:
