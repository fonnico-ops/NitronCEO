canais_teams:
  # Canal de time, para o sinal que é do grupo e não de uma pessoa.
  # Confira os nomes exatos do Teams antes de ativar o envio — o motor procura
  # a equipe e o canal por nome e falha se não achar.
  comercial:
    team: "Comercial Nitron"
    canal: "Geral"
  producao:
