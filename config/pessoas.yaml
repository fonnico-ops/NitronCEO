    escalonar_para: ceo
    pessoas:
      - nome: Alex Souza
        email: alex.souza@nitron.com.br
      - nome: Charles Silva
        email: charles.silva@nitron.com.br

  qualidade:
    nome: Qualidade
    escalonar_para: ceo
    pessoas:
      # Mesma dupla da produção: na Nitron produção e qualidade respondem
      # juntas. São papéis separados de propósito — KPIs diferentes, cobranças
      # diferentes — ainda que as pessoas coincidam hoje.
      - nome: Alex Souza
        email: alex.souza@nitron.com.br
      - nome: Charles Silva
        email: charles.silva@nitron.com.br

  ecommerce:
    nome: E-commerce
    escalonar_para: ceo
    pessoas:
      - nome: Ana Julia
        email: ecommerce2@nitron.com.br
        # Confirmado pelo CEO: o e-mail dela é o ecommerce2. Mas nos chats
        # do Teams ela aparece como ecommerce@nitron.com.br — provavelmente
        # a caixa que virou o UPN dela no Entra. Confirme no admin center
        # antes de ligar o Teams; se o UPN for mesmo o ecommerce@, basta
        # descomentar a linha abaixo e a mensagem direta volta a chegar.
        # upn: ecommerce@nitron.com.br

  projetos:
    nome: Projetos / Moldes
    escalonar_para: ceo
    pessoas:
      - nome: Projetos
        email: projetos3@nitron.com.br

canais_teams:
  # Canal de time, para o sinal que é do grupo e não de uma pessoa.
  # Confira os nomes exatos do Teams antes de ativar o envio — o motor procura
  # a equipe e o canal por nome e falha se não achar.
  comercial:
    team: "Comercial Nitron"
    canal: "Geral"
  producao:
    team: "Produção Nitron"
    canal: "Chão de Fábrica"
  financeiro:
