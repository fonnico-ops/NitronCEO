# Quem responde por quê. O motor não sabe cobrar ninguém sem este arquivo.
#
# `pessoas`  -> uma ou mais pessoas por papel. Cada uma recebe a cobrança no
#               Teams e, quando o KPI pede e-mail, também na caixa dela.
#               Dois nomes num papel significa que os DOIS são cobrados, não
#               que um cobre o outro: cobrança sem dono único vira cobrança de
#               ninguém, então o papel é que é o dono, e ambos respondem por ele.
# `escalonar_para` -> para quem a cobrança sobe quando o SLA estoura.
#               Hoje tudo sobe direto para o CEO porque a hierarquia
#               intermediária não foi declarada. Se houver gerente entre a
#               pessoa e o Renato, aponte aqui — o degrau a mais é o que evita
#               que assunto operacional chegue no CEO.
#
# `email`        -> para onde vai o e-mail.
# `ghl_contato`  -> id do contato no Go High Level, para o canal GHL.
#                   NUNCA deduzido por busca: a base da location Nitron
#                   mistura funcionário com cliente, e em 23/09/2026 o
#                   e-mail cristiane.alves@nitron.com.br resolvia para
#                   "Cristiane ATLETICO CLUBE" — o contato do cliente
#                   COOPERCOTIA, com as tags da Nina. Cobrar por aquele id
#                   levaria assunto interno para a conversa de um cliente.
#                   Rode `nitronceo ghl-contatos` e cole o que ele aprovar.
#                   Sem o id, a pessoa segue sendo cobrada por e-mail.
#
# `upn`   -> como o Microsoft 365 conhece a pessoa, para a mensagem direta do
#            Teams. Só precisa ser declarado quando difere do e-mail.
#
# Quase sempre os dois são iguais, e por isso essa diferença é traiçoeira:
# quando o UPN está errado, o Graph devolve 404 e a cobrança simplesmente
# não chega — sem erro visível para quem cobra. Caso real conferido no
# diretório em 23/09/2026: a Ana Julia recebe e-mail em
# ecommerce2@nitron.com.br e aparece nos chats do Teams como
# ecommerce@nitron.com.br. O e-mail está certo; o UPN é que é outro.

