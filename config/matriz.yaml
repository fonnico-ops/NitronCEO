# CAPACIDADE — a meta de R$ 500 mil/dia como restrição, não como desejo
# ---------------------------------------------------------------------------

- id: agenda_carga_capacidade
  titulo: Agenda de carga contra a capacidade
  pergunta: A agenda dos próximos dias cabe nos R$ 500 mil por dia?
  area: logistica
  sql: sql/agenda_carga_capacidade.sql
  frequencia: diaria
  horario: "07:30"
  metrica: VLR_A_REMANEJAR
  unidade: reais
  avaliacao: { tipo: limite_superior, verde: 200000, amarelo: 600000, vermelho: 1200000 }
  dono: logistica
  canal_teams: logistica
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "R$ {valor} agendados acima da capacidade de carga"
    passos:
      - "Puxe carga das datas que estouram para os dias ociosos da mesma semana."
      - "Os dias ociosos estão na lista — não é falta de carga, é distribuição."
      - "Para o que não cabe na semana: avise o comercial antes do cliente cobrar."
      - "Ordens abertas com data vencida há mais de 30 dias: fecha ou reprograma?"
    sla_resposta_horas: 4
  status_dado: validado
  modo: ativo
  observacao: >
    A regra: a operação carrega e fatura ~R$ 500 mil por dia útil nas empresas
    1, 2, 4 e 14. Data agendada acima disso não é ambição, é ficção — o
    caminhão não sai, o pedido não fatura, e o dia seguinte herda a sobra.
    FONTE: TGFORD.DTPREVSAIDA com o valor dos pedidos da ordem (por subquery
    escalar, não por join — join multiplicaria o valor da nota).
    AFERIDO 22/09/26, próximos 15 dias úteis: 11 dias agendados, 2 ESTOURADOS
    e 9 OCIOSOS. R$ 1.715.609,62 precisam sair das datas que estouram e há
    R$ 3.512.518,91 de capacidade parada nos outros dias.
    Os dois estouros: 02/10 com R$ 1.875.158 em 28 ordens TODAS ABERTAS
    (3,8x a capacidade) e 22/09 com R$ 840.451 (1,7x). No mesmo período,
    29/09 tem R$ 37.728 e 01/10 tem zero.
    O problema não é falta de carga — é distribuição.
    Conta ainda 58 ordens ABERTAS com data prevista vencida há mais de 30
    dias: carga que nunca saiu e ninguém fechou. (As 26.632 ordens FECHADAS
    com data vencida são histórico normal e não entram — contá-las foi o
    primeiro erro desta query.)

- id: carteira_disponivel_faturar
  titulo: Carteira disponível para faturar
  pergunta: Tem pedido com estoque para sustentar a meta do dia?
  area: comercial
  sql: sql/carteira_disponivel_faturar.sql
  frequencia: diaria
  horario: "07:30"
  metrica: DIAS_DE_META
  unidade: contagem
  avaliacao: { tipo: limite_inferior, verde: 3, amarelo: 2, vermelho: 1 }
  dono: diretor_comercial
  canal_teams: comercial
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "Só {valor} dias de meta na carteira atendível"
    passos:
      - "Quanto entra de pedido novo esta semana, por representante."
      - "O que está sem estoque é do PCP — a coluna separa os dois."
      - "Se a carteira está cheia e não faturamos, o gargalo é expedição."
    sla_resposta_horas: 8
  status_dado: validado
  modo: ativo
  observacao: >
    Não adianta cobrar R$ 500 mil/dia sem saber se existe o que faturar. Este
    KPI responde a pergunta que vem antes da meta.
    AFERIDO 22/09/26 (empresas 1,2,4,14, carteira de 45 dias sem ordem de
    carga): 727 pedidos e R$ 2.229.298,53, dos quais R$ 2.011.711,42 COM
    estoque — 4,0 DIAS DE META — e R$ 217.587,11 sem estoque.
    A leitura que importa: a carteira NÃO é o gargalo hoje. Se o dia não bate
    R$ 500 mil com 4 dias de meta na mão, o gargalo está na expedição ou na
    agenda de carga.
    SIMPLIFICAÇÃO DECLARADA: disponibilidade item a item contra o saldo, SEM
    alocação sequencial — dois pedidos do mesmo SKU podem ambos aparecer como
    atendíveis quando o saldo só cobre um, então o número infla um pouco. A
    alocação correta é trabalho da skill de roteirização, no momento de montar
    a carga; aqui vale a ordem de grandeza.

