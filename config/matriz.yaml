# =============================================================================
# MATRIZ DE COBRANÇA DO CEO — Grupo Nitron
# =============================================================================
# Cada bloco responde a quatro perguntas, nesta ordem. Um KPI que não responde
# às quatro não entra na matriz — vira dashboard, e dashboard ninguém cobra.
#
#   1. O QUE eu meço?      -> sql + metrica
#   2. QUANDO é problema?  -> avaliacao (verde / amarelo / vermelho)
#   3. QUEM resolve?       -> dono (papel de config/pessoas.yaml)
#   4. O QUE ele faz?      -> acao.passos + acao.sla_resposta_horas
#
# `status_dado` diz o quanto confiar no número HOJE:
#   validado  -> query rodada em produção, resultado conferido (22/09/2026)
#   calibrar  -> query roda, mas o limiar precisa de acordo com a área antes
#                de virar cobrança. Até lá o motor só observa (`modo: sombra`).
#
# `modo`: ativo  -> avalia, notifica e cobra
#         sombra -> avalia e registra, NÃO notifica ninguém
# =============================================================================

versao: 1
recorte_padrao:
  # "Nitron" hoje = 1,2,3,4,14,17,20. Gadgets antigos usam 1,2,4,14 — se um
  # número não bater com um gadget, confira o recorte antes de procurar bug.
  codemp: [1, 2, 3, 4, 14, 17, 20]
  excluir_intercompany: true

kpis:

# ---------------------------------------------------------------------------
# COMERCIAL
# ---------------------------------------------------------------------------

- id: faturamento_ritmo
  titulo: Ritmo de faturamento
  pergunta: No ritmo de hoje, fecho o mês na meta?
  area: comercial
  sql: sql/faturamento_ritmo.sql
  frequencia: diaria
  horario: "07:30"
  metrica: PCT_PROJECAO_META
  unidade: percentual
  avaliacao:
    tipo: limite_inferior      # quanto menor, pior
    verde: 100
    amarelo: 92
    vermelho: 85
  dono: diretor_comercial
  canal_teams: comercial
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "Ritmo de faturamento projeta {valor}% da meta"
    passos:
      - "Diga o que muda na semana: quais pedidos entram e de quem."
      - "Aponte o gargalo real — carteira, estoque ou expedição — com número."
      - "Se o gargalo não é comercial, nomeie a área e eu cobro lá."
    sla_resposta_horas: 4
  status_dado: validado
  modo: ativo
  observacao: >
    Âncora ATUALCOM='C' + AD_INSEREDASH='S' (não TIPMOV='V' — isso descarta a
    TOP 3110, que é faturamento real). Validado 22/09/26: set/26 MTD
    R$ 6.266.686,56 em 4.869 notas; ago/26 fechado R$ 7.468.338,10.

- id: pedidos_ritmo
  titulo: Ritmo de entrada de pedidos
  pergunta: A carteira que alimenta o mês que vem está entrando?
  area: comercial
  sql: sql/pedidos_ritmo.sql
  frequencia: diaria
  horario: "07:30"
  metrica: PCT_VS_MEDIA_90D
  unidade: percentual
  avaliacao: { tipo: limite_inferior, verde: 95, amarelo: 85, vermelho: 75 }
  dono: diretor_comercial
  canal_teams: comercial
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "Entrada de pedidos em {valor}% da média de 90 dias"
    passos:
      - "Liste os 5 clientes que pararam de comprar vs. o mesmo período anterior."
      - "Diga o que já foi feito de contato e o que falta."
      - "Traga a previsão de fechamento da semana, por representante."
    sla_resposta_horas: 8
  status_dado: validado
  modo: ativo
  observacao: >
    Set/26 MTD: 4.350 pedidos, R$ 4.331.656,45.

- id: performance_representante
  titulo: Performance por representante
  pergunta: Quem está fora do ritmo e há quantos dias?
  area: comercial
  sql: sql/performance_representante.sql
  frequencia: semanal
  dia_semana: seg
  horario: "08:00"
  metrica: QTD_ABAIXO_META
  unidade: contagem
  avaliacao: { tipo: limite_superior, verde: 10, amarelo: 20, vermelho: 28 }
  dono: diretor_comercial
  canal_teams: comercial
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "{valor} representantes abaixo da meta"
    passos:
      - "Para cada nome da lista: plano de recuperação ou data de desligamento."
      - "Não aceito 'vou falar com ele' — quero o que foi combinado e até quando."
    sla_resposta_horas: 24
  status_dado: calibrar
  modo: sombra
  observacao: >
    Roda e dá lista nominal. Aferido 22/09/26 (só TGFVEN.ATIVO='S', piso de
    relevância R$ 5.000 de média 3M): 53 representantes, 26 abaixo de 80% da
    própria média, 16 abaixo de 50%, 7 zerados no mês.
    POR QUE NASCE EM SOMBRA: no mesmo mês o faturamento total projeta 107% da
    média. Metade dos representantes cair enquanto o total sobe é mudança de
    mix (ou meta individual desatualizada), não queda de esforço — cobrar 26
    pessoas com esse número queima a credibilidade da matriz na primeira
    semana. Ativar quando o diretor comercial fixar a meta individual.
    Zero notas sem vendedor atribuído no período — a distorção clássica de
    ranking não está ocorrendo, o que é uma boa notícia.

- id: performance_canal
  titulo: Performance por canal
  pergunta: Qual canal está carregando o mês e qual está afundando?
  area: comercial
  sql: sql/performance_canal.sql
  frequencia: semanal
  dia_semana: seg
  horario: "08:00"
  metrica: PCT_PIOR_CANAL_VS_MEDIA
  unidade: percentual
  avaliacao: { tipo: limite_inferior, verde: 90, amarelo: 75, vermelho: 60 }
  dono: diretor_comercial
  canal_teams: comercial
  notificar: { verde: [], amarelo: [teams], vermelho: [teams] }
  acao:
    titulo: "Canal {rotulo} em {valor}% da própria média"
    passos:
      - "Diga se é problema de demanda, de preço ou de cobertura."
      - "Se for preço, traga a proposta — não a reclamação."
    sla_resposta_horas: 24
  status_dado: calibrar
  modo: sombra
  observacao: >
    Canal vem de TGFCAB.AD_ORIGEM (Representante, FORÇA DE VENDAS, Farmer,
    Gestor, Outside). PROBLEMA: 27% do faturamento de set/26 (R$ 1.716.600,96
    em 4.079 notas) está com AD_ORIGEM NULO. Enquanto isso não for corrigido no
    cadastro, o ranking de canal é enviesado. Fica em sombra.

