  frequencia: semanal
  dia_semana: seg
  horario: "08:00"
  metrica: PCT_PIOR_CANAL_VS_MEDIA
  unidade: percentual
  avaliacao: { tipo: limite_inferior, verde: 90, amarelo: 75, vermelho: 60 }
  dono: diretor_comercial
  canal_teams: comercial
  notificar: { verde: [], amarelo: [teams], vermelho: [teams] }
  acao:
    titulo: "Canal {rotulo} em {valor}% da própria média"
    passos:
      - "Diga se é problema de demanda, de preço ou de cobertura."
      - "Se for preço, traga a proposta — não a reclamação."
    sla_resposta_horas: 24
  status_dado: calibrar
  modo: sombra
  observacao: >
    Canal vem de TGFCAB.AD_ORIGEM (Representante, FORÇA DE VENDAS, Farmer,
    Gestor, Outside). PROBLEMA: 27% do faturamento de set/26 (R$ 1.716.600,96
    em 4.079 notas) está com AD_ORIGEM NULO. Enquanto isso não for corrigido no
    cadastro, o ranking de canal é enviesado. Fica em sombra.

