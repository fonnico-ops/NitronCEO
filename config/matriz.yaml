- id: fluxo_caixa_critico
  titulo: Fluxo de caixa dos próximos 7 dias
  pergunta: Fecha ou falta? E se falta, quanto e em que dia?
  area: financeiro
  sql: sql/fluxo_caixa.sql
  frequencia: diaria
  horario: "07:00"
  metrica: SALDO_D0_D7
  unidade: reais
  avaliacao:
    tipo: limite_inferior
    verde: 0
    amarelo: -300000
    vermelho: -1000000
  dono: financeiro
  canal_teams: financeiro
  notificar: { verde: [], amarelo: [teams, email], vermelho: [teams, email] }
  acao:
    titulo: "Gap de caixa de R$ {valor} em 7 dias"
    passos:
      - "Qual dia estoura e de quanto é o buraco naquele dia."
      - "O que dá para antecipar de recebível e a que custo."
      - "O que dá para empurrar de pagamento sem quebrar fornecedor crítico."
      - "Se precisar de linha bancária, qual, quanto e até quando decidir."
    sla_resposta_horas: 2
  status_dado: validado
  modo: ativo
  observacao: >
    Aferido 22/09/26 (títulos em aberto, não-provisão, Nitron):
      D0–D7:  receber R$ 1.675.470,84 / pagar R$ 1.817.828,24  -> gap -142.357,40
      D8–D30: receber R$ 5.676.974,53 / pagar R$ 13.426.196,66 -> gap -7.749.222,13
      Vencido a receber (365d): R$ 9.728.499,68 em 3.352 títulos
    O gap de D8–D30 é a notícia, não o de D0–D7. NÃO inclui saldo bancário
    inicial — ver docs/achados-de-dados.md, item "saldo de abertura".

