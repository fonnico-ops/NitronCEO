- id: cargas_montadas_dia
  titulo: Ordens de carga montadas por dia
  pergunta: A expedição está escoando no ritmo da carteira?
  area: logistica
  sql: sql/cargas_dia.sql
  frequencia: diaria
  horario: "07:30"
  metrica: ORDENS_ONTEM
  unidade: contagem
  avaliacao: { tipo: limite_inferior, verde: 30, amarelo: 20, vermelho: 12 }
  dono: logistica
  canal_teams: logistica
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "Só {valor} ordens de carga montadas ontem"
    passos:
      - "Diga o que travou: doca, veículo, separação ou falta de pedido com estoque."
      - "Quantos pedidos ficaram fora da carga e por quê."
      - "O que sai hoje para recuperar."
    sla_resposta_horas: 3
  status_dado: validado
  modo: ativo
  observacao: >
    Fonte é TGFORD (nativa, viva). NÃO usar AD_CARGADIARIA / AD_ORDENSCARGA /
    AD_PEDIDOSCARGA — pararam de ser alimentadas em 20/05/2026.
    Observado 14–22/09/26: 15, 22, 28, 90, 33, 5, 54, 48 ordens/dia.

- id: agendamentos_reagendados
  titulo: Entregas reagendadas
  pergunta: Quantas entregas o cliente empurrou, e quem tratou?
  area: logistica
  sql: sql/agendamentos_reagendados.sql
  frequencia: diaria
  horario: "07:30"
  metrica: PCT_REAGENDADO
  unidade: percentual
  avaliacao: { tipo: limite_superior, verde: 5, amarelo: 12, vermelho: 20 }
  dono: logistica
  canal_teams: logistica
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "{valor}% das entregas agendadas foram empurradas"
    passos:
      - "Separe o que foi pedido do cliente do que foi falha nossa de janela."
      - "Para as nossas: o que muda no roteiro a partir de amanhã."
    sla_resposta_horas: 8
  status_dado: calibrar
  modo: sombra
  observacao: >
    AD_TSIAGENENT está viva (384 agendamentos em set/26). MAS o STATUS='M'
    (Mudança de Data) aparece só 1 vez no mês — a equipe registra a mudança
    sobrescrevendo NOVADATA em vez de marcar o status. O SQL usa NOVADATA <>
    data original como proxy; validar com a expedição antes de ativar.

