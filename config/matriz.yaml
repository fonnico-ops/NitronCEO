- id: maquinas_paradas
  titulo: Injetoras paradas agora
  pergunta: Quantas injetoras estão paradas neste momento, e por quê?
  area: producao
  sql: sql/maquinas_paradas.sql
  frequencia: horaria
  metrica: PARADAS_60MIN
  unidade: contagem
  avaliacao: { tipo: limite_superior, verde: 2, amarelo: 4, vermelho: 7 }
  dono: gerente_producao
  canal_teams: producao
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "{valor} injetoras paradas há mais de 1 hora"
    passos:
      - "A lista já traz o motivo de cada uma. Diga a previsão de religar."
      - "As sem motivo apontado: quem estava na máquina e o que aconteceu?"
      - "Se é falta de MP ou molde, diga quem está resolvendo e desde quando."
    sla_resposta_horas: 1
  status_dado: validado
  modo: ativo
  observacao: >
    FONTE TROCADA em 22/09/26: TPRIWC (parada aberta = DHFINAL nulo) com o
    motivo vindo de TPRMTP. O proxy anterior (tempo desde TPRWCP.AD_DHCICLO)
    dizia QUE parou mas não dizia por quê — e o motivo sempre foi a pergunta
    da cobrança.
    REFEIÇÃO (motivo 13) sai do número principal: é parada programada, e em
    22/09 às 18:30 eram 8 das 13 paradas abertas. Contá-las dispararia alerta
    todo dia no mesmo horário. Refeição acima de 90 min vira REFEICAO_LONGA —
    aí não é refeição, é apontamento que ninguém fechou.
    AFERIDO 22/09/26 18:30 — 13 paradas abertas: INJETORA 15 em manutenção de
    molde há 139 min, INJETORA 38 em setup há 32 min, duas SEM MOTIVO
    (INJETORA 35 há 81 min, INJETORA 29 há 61 min) e 8 em refeição.

- id: setup_maquinas
  titulo: Tempo de setup das injetoras
  pergunta: A troca de molde está dentro dos 40 minutos de padrão?
  area: producao
  sql: sql/setup_maquinas.sql
  frequencia: diaria
  horario: "07:30"
  metrica: PCT_ACIMA_PADRAO
  unidade: percentual
  avaliacao: { tipo: limite_superior, verde: 40, amarelo: 60, vermelho: 80 }
  dono: gerente_producao
  canal_teams: producao
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "{valor}% das trocas de molde estouraram os 40 minutos"
    passos:
      - "Quais máquinas concentram o estouro — a lista traz a mediana de cada uma."
      - "Falta ferramenta, molde pré-aquecido ou gente treinada? Escolha uma."
      - "Setup apontado acima de 24h não é troca, é apontamento aberto: quem fecha?"
    sla_resposta_horas: 8
  status_dado: validado
  modo: ativo
  observacao: >
    SAIU DA SOMBRA em 22/09/26, com a fonte certa: TPRIWC (intervalos de
    parada do centro de trabalho) + TPRMTP (motivos), motivo 10 = SETUP.
    A tabela está VIVA — 80.308 linhas, última gravação 22/09/26 18:28.
    Substitui duas tentativas ruins: AD_PARADAMAQUINA (morta desde 31/10/2024)
    e a inferência por lacuna entre OPs, que dava mediana de 2 minutos e não
    media troca de molde nenhuma.
    AFERIDO (30 dias): 217 setups fechados, MEDIANA de 127 min contra padrão
    de 40, e apenas 54 (25%) dentro do padrão. 68 passaram de 4 horas.
    Usa MEDIANA, não média: a média dá 329 min porque 8 paradas passam de 24h
    (a maior tem 91 horas) — essas são apontamento que ficou aberto
    atravessando turno, saem do cálculo e são contadas à parte, porque são
    problema de apontamento e não de setup.

- id: ruptura_estoque
  titulo: Produtos sem estoque com pedido na carteira
  pergunta: Quanto de venda está parada esperando o PCP produzir?
  area: pcp
  sql: sql/ruptura_estoque.sql
  frequencia: diaria
  horario: "07:30"
  metrica: VLR_EM_RISCO
  unidade: reais
  avaliacao: { tipo: limite_superior, verde: 150000, amarelo: 400000, vermelho: 800000 }
  dono: pcp
  canal_teams: producao
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "R$ {valor} de carteira parada por falta de estoque"
    passos:
      - "Dos itens da lista: quais entram na programação desta semana."
      - "Quais dependem de MP e qual a data de chegada."
      - "Quais são transferência do CD (não são ruptura) — separe-os."
    sla_resposta_horas: 4
  status_dado: validado
  modo: ativo
  observacao: >
    CORRIGIDO EM 22/09/26. A primeira versão somava CODLOCAL 1080000
    ("Estoque para Transferência"), que é conta de CONTRAPARTIDA e fica
    negativa por construção — o PA DE LIXO (268), campeão de venda, aparecia
    com -123.641 unidades. Com a 1080000 fora, o mesmo item tem +28.241.
    Efeito no KPI: de 460 itens / R$ 1.577.274,91 para 92 itens /
    R$ 287.768,76. Agora é número que dá para cobrar o PCP.
    Sobram 4.347 endereços físicos com saldo negativo na carteira — isso é
    inconsistência de endereçamento e é sinal para o WMS, não para o PCP;
    sai na coluna ENDERECOS_NEGATIVOS.
    CODEMP 1 segue fora da fonte de saldo (12,5 mi de linhas somando 3e19).

