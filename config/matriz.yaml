- id: maquinas_paradas
  titulo: Injetoras paradas agora
  pergunta: Quantas das 45 injetoras estão sem tiro neste momento?
  area: producao
  sql: sql/maquinas_paradas.sql
  frequencia: horaria
  metrica: PARADAS_60MIN
  unidade: contagem
  avaliacao: { tipo: limite_superior, verde: 2, amarelo: 4, vermelho: 7 }
  dono: gerente_producao
  canal_teams: producao
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "{valor} injetoras paradas há mais de 1 hora"
    passos:
      - "Para cada máquina da lista: motivo e previsão de religar."
      - "Se é falta de MP ou molde, diga quem está resolvendo e desde quando."
    sla_resposta_horas: 1
  status_dado: validado
  modo: ativo
  observacao: >
    Fonte é o batimento IoT em TPRWCP.AD_DHCICLO (45 injetoras com
    AD_MONITORADO='S', sinal vivo). NÃO usar AD_PARADAMAQUINA — morreu em
    31/10/2024. E AD_ESTADOATUAL está 100% nulo: o sinal confiável é o tempo
    desde o último ciclo, não o estado declarado.
    Aferido 22/09/26 16:45 — 45 monitoradas, 1 parada há mais de 60 min.

- id: setup_maquinas
  titulo: Tempo de setup das injetoras
  pergunta: A troca de molde está dentro dos 40 minutos de padrão?
  area: producao
  sql: sql/setup_maquinas.sql
  frequencia: diaria
  horario: "07:30"
  metrica: PCT_ACIMA_PADRAO
  unidade: percentual
  avaliacao: { tipo: limite_superior, verde: 20, amarelo: 40, vermelho: 60 }
  dono: gerente_producao
  canal_teams: producao
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "{valor}% das trocas estouraram o padrão de setup"
    passos:
      - "Quais máquinas e quais turnos concentram o estouro."
      - "Falta ferramenta, molde pré-aquecido ou gente treinada? Escolha uma."
    sla_resposta_horas: 8
  status_dado: calibrar
  modo: sombra
  observacao: >
    LACUNA REAL. O padrão existe (TPRWCP.TEMPOSETUP = 40 min nas 45 injetoras),
    mas o REALIZADO não é mais gravado: AD_PARADAMAQUINA (MOTIVO='SM') parou em
    31/10/2024. O SQL atual infere setup pela lacuna entre o último ciclo de uma
    OP e o primeiro da OP seguinte na mesma injetora (AD_APONTACICLO +
    AD_TGPAPO). É uma aproximação — precisa ser conferida contra o chão de
    fábrica antes de virar cobrança. Ver docs/achados-de-dados.md.

- id: ruptura_estoque
  titulo: Produtos sem estoque com pedido na carteira
  pergunta: Quanto de venda está parada esperando o PCP produzir?
  area: pcp
  sql: sql/ruptura_estoque.sql
  frequencia: diaria
  horario: "07:30"
  metrica: VLR_EM_RISCO
  unidade: reais
  avaliacao: { tipo: limite_superior, verde: 300000, amarelo: 800000, vermelho: 1500000 }
  dono: pcp
  canal_teams: producao
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "R$ {valor} de carteira parada por falta de estoque"
    passos:
      - "Dos itens da lista: quais entram na programação desta semana."
      - "Quais dependem de MP e qual a data de chegada."
      - "Quais são transferência do CD (não são ruptura) — separe-os."
    sla_resposta_horas: 4
  status_dado: calibrar
  modo: sombra
  observacao: >
    Roda e dá número (22/09/26: 460 itens sem saldo, R$ 1.577.274,91 de carteira
    exposta), mas o SALDO ainda não é confiável o bastante para cobrar o PCP:
    - TGFEST na CODEMP 1 tem 12,5 milhões de linhas e soma 3×10^19 unidades —
      dado histórico corrompido. Inutilizável.
    - CODEMP 4 e 14 somam saldo NEGATIVO no total.
    - TGFEST.QTDPEDPENDEST está 100% zerado, então a demanda tem que vir de
      TGFITE sobre pedidos pendentes.
    - Parte do que aparece como ruptura é transferência interna CD->produção,
      que a skill de roteirização trata como NÃO-ruptura.
    Calibrar com o PCP qual empresa é a fonte de saldo por linha de produto.

