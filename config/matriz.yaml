- id: devolucoes
  titulo: Notas devolvidas
  pergunta: Quanto do que faturei está voltando, e por quê?
  area: logistica
  sql: sql/devolucoes.sql
  frequencia: diaria
  horario: "07:30"
  metrica: PCT_SOBRE_FATURAMENTO
  unidade: percentual
  avaliacao: { tipo: limite_superior, verde: 1.5, amarelo: 3.0, vermelho: 5.0 }
  dono: logistica
  canal_teams: logistica
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "Devoluções em {valor}% do faturamento"
    passos:
      - "Top 3 clientes da janela e o motivo de cada devolução."
      - "Separe erro nosso (produto trocado, quantidade errada, nota errada) de recusa do cliente."
      - "Se a causa for defeito de produto, nomeie — aí é da produção e eu cobro lá."
      - "Contenção para hoje e correção para a semana."
    sla_resposta_horas: 8
  status_dado: validado
  modo: ativo
  observacao: >
    DONO É A EXPEDIÇÃO/FATURAMENTO, não a qualidade — definido pela diretoria
    em 22/09/26. Nota que volta é problema de expedição até prova em
    contrário; defeito de produto é a exceção, não a regra.
    NÃO DÁ PARA SEPARAR AUTOMATICAMENTE: TGFCAB.AD_MOTIVO está 100% NULO nas
    741 devoluções dos últimos 180 dias. Por isso a ação pede que a causa seja
    nomeada na resposta — quando for defeito, a cobrança migra para a produção
    manualmente. Preencher AD_MOTIVO destravaria o corte automático.
    ARMADILHA CONFIRMADA: TIPMOV='D' cru infla ~3x. A TOP 2203 "Devolução
    Simbólica Consignado" somou R$ 1.426.216,82 no 3º tri/26 e NÃO é devolução
    de cliente — é acerto de consignação. O SQL exclui a 2203.
    Devolução real no trimestre: TOPs 5205, 2201, 2206, 2215.

- id: reentradas
  titulo: Notas com reentrada / refaturamento
  pergunta: O que voltou, foi resolvido e refaturado — ou está parado?
  area: logistica
  sql: sql/reentradas.sql
  frequencia: semanal
  dia_semana: seg
  horario: "08:00"
  metrica: QTD_EM_ABERTO
  unidade: contagem
  avaliacao: { tipo: limite_superior, verde: 25, amarelo: 45, vermelho: 80 }
  dono: logistica
  canal_teams: logistica
  notificar: { verde: [], amarelo: [teams], vermelho: [teams] }
  acao:
    titulo: "{valor} notas devolvidas ainda sem refaturamento"
    passos:
      - "Há quantos dias cada uma está parada e o que falta para reexpedir."
      - "Se a mercadoria não pode voltar ao estoque, diga o que será feito com ela."
      - "Qual a causa-raiz mais frequente e o que já mudou por causa dela."
    sla_resposta_horas: 24
  status_dado: validado
  modo: ativo
  observacao: >
    DONO É A EXPEDIÇÃO/FATURAMENTO — definido pela diretoria em 22/09/26.
    Refaturar é reemitir a nota e reexpedir a mercadoria, e quem faz isso é
    quem faturou da primeira vez.
    O número que cobra não é o total de refaturamentos e sim QTD_EM_ABERTO: a
    nota que voltou e ainda não saiu de novo. Cada uma dessas é mercadoria
    parada no CD e cliente esperando.
    TGFCAB.AD_REFATURADA='S'. Set/26: 17 notas, R$ 186.222,34.
    TGFCAB.AD_NUDEV (vínculo com a devolução) preenchido em 58 notas no mês.

