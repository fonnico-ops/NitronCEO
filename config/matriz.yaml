- id: suspensos_para_reativar
  titulo: Suspensos que continuam vendendo
  pergunta: Quais produtos suspensos o mercado ainda está comprando?
  area: pcp
  sql: sql/suspensos_para_reativar.sql
  frequencia: semanal
  dia_semana: seg
  horario: "08:00"
  metrica: VLR_VENDIDO_180D
  unidade: reais
  avaliacao: { tipo: limite_superior, verde: 400000, amarelo: 900000, vermelho: 1800000 }
  dono: pcp
  canal_teams: producao
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "R$ {valor} vendidos em 180 dias de produtos que estão suspensos"
    passos:
      - "Publique aqui na resposta a lista de reativação, com o que entra e a data."
      - "Dos 15 primeiros da lista: quais voltam, quais ficam suspensos e por quê."
      - "Os que têm pedido aberto agora são os mais urgentes — cliente já comprou."
      - "Para os que não voltam: o cadastro precisa ser corrigido para pararem de vender."
    sla_resposta_horas: 48
  status_dado: validado
  modo: ativo
  observacao: >
    Existe uma lista de reativação com o Anderson que NÃO está no ERP. Este
    KPI não substitui a lista — dá a ela tamanho e ranking, e a cobrança pede
    que a lista seja publicada na resposta, onde fica com data e nome.
    O sinal é objetivo: produto marcado AD_AG_SUSPENSO='S' que MESMO ASSIM
    vendeu nos últimos 180 dias. Ou a venda é excepcional e some, ou o produto
    foi suspenso e o mercado não concordou.
    AFERIDO 22/09/26: 652 suspensos no cadastro, 421 (65%) venderam nos
    últimos 180 dias somando R$ 1.581.142,14, e 165 têm PEDIDO ABERTO agora
    (R$ 27.646,90).
    A métrica é o VALOR e não a contagem: 421 itens é lista que ninguém lê;
    os 15 primeiros por faturamento é reunião de meia hora.

- id: injecao_terceirizada
  titulo: Injeção fora da Nitron
  pergunta: Quanto custa ter molde injetando em terceiro, e com quem?
  area: projetos
  sql: sql/injecao_terceirizada.sql
  frequencia: mensal
  dia_mes: 5
  horario: "08:00"
  metrica: VLR_TRIMESTRE
  unidade: reais
  avaliacao: { tipo: limite_superior, verde: 600000, amarelo: 1200000, vermelho: 2000000 }
  dono: projetos
  canal_teams: producao
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "R$ {valor} de injeção terceirizada no trimestre"
    passos:
      - "Publique aqui na resposta quais moldes estão em cada terceiro."
      - "Para os da Tanamu, que é 73% do gasto: quais voltam e em que ordem?"
      - "Para cada molde que volta: qual injetora recebe e o que sai dela."
      - "Se a capacidade interna não comporta, diga isso com número — aí a conversa é outra."
    sla_resposta_horas: 48
  status_dado: validado
  modo: ativo
  observacao: >
    O ERP NÃO DIZ qual molde está onde. AD_APONTACICLO tem LOCALINJECAO com o
    domínio CDI:Construplast | Nitron | Tanamu, mas em 180 dias TODAS as 2.628
    OPs foram apontadas como "Nitron" — a produção terceirizada não passa pelo
    apontamento. Por isso a ação pede a lista na resposta.
    O que o ERP guarda é o CUSTO, e ele basta para dimensionar a decisão.
    AFERIDO 22/09/26, últimos 12 meses (natureza 3010105): R$ 4.400.168 no
    total, com TANAMU em R$ 3.195.053 (73%, e R$ 862.655 só no trimestre),
    MAGIC TOYS R$ 465.390, L PLAST R$ 253.404, J KOVACS R$ 237.291.
    A métrica é o custo do TRIMESTRE: o de 12 meses é história e não muda com
    ação; o do trimestre responde se a internalização está acontecendo.
    PARA MELHORAR: se o apontamento passar a usar LOCALINJECAO de verdade, dá
    para medir molde a molde em vez de só o custo agregado.

