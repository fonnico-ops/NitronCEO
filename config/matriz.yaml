- id: paradas_sem_motivo
  titulo: Paradas sem motivo apontado
  pergunta: A fábrica sabe por que parou?
  area: producao
  sql: sql/paradas_sem_motivo.sql
  frequencia: semanal
  dia_semana: seg
  horario: "08:00"
  metrica: PCT_SEM_MOTIVO
  unidade: percentual
  avaliacao: { tipo: limite_superior, verde: 15, amarelo: 30, vermelho: 50 }
  dono: gerente_producao
  canal_teams: producao
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "{valor}% das paradas sem motivo apontado"
    passos:
      - "Qual turno e qual máquina concentram a falta de apontamento."
      - "É falta de treino, tela ruim ou motivo que não existe no cadastro?"
      - "Enquanto isso não cair, os KPIs de setup e de molde medem só metade."
    sla_resposta_horas: 48
  status_dado: validado
  modo: ativo
  observacao: >
    Isto não é indicador de produção — é indicador SOBRE o indicador.
    AFERIDO 22/09/26 (30 dias): 1.791 das 3.066 paradas (58%) estão SEM
    MOTIVO, somando 386.411 minutos = 6.440 horas. É a maior linha da tabela
    de paradas, maior que setup e manutenção juntos.
    Enquanto 58% do tempo parado não tem causa, nenhum plano de redução pode
    ser feito, e os KPIs de setup e de molde estão medindo só a parte que
    alguém se deu ao trabalho de classificar.
    O motivo 30 ("LIBERADO", 757 paradas / 323.064 min) fica FORA do
    numerador: tem código, então foi apontado. Se na prática for usado como
    "não sei", vale rever — mas isso é decisão da produção, não suposição
    desta query.
