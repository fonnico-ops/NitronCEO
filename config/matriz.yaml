# =============================================================================
# MATRIZ DE COBRANÇA DO CEO — Grupo Nitron
# =============================================================================
# Cada bloco responde a quatro perguntas, nesta ordem. Um KPI que não responde
# às quatro não entra na matriz — vira dashboard, e dashboard ninguém cobra.
#
#   1. O QUE eu meço?      -> sql + metrica
#   2. QUANDO é problema?  -> avaliacao (verde / amarelo / vermelho)
#   3. QUEM resolve?       -> dono (papel de config/pessoas.yaml)
#   4. O QUE ele faz?      -> acao.passos + acao.sla_resposta_horas
#
# `status_dado` diz o quanto confiar no número HOJE:
#   validado  -> query rodada em produção, resultado conferido (22/09/2026)
#   calibrar  -> query roda, mas o limiar precisa de acordo com a área antes
#                de virar cobrança. Até lá o motor só observa (`modo: sombra`).
#
# `modo`: ativo  -> avalia, notifica e cobra
#         sombra -> avalia e registra, NÃO notifica ninguém
# =============================================================================

versao: 1
recorte_padrao:
  # "Nitron" hoje = 1,2,3,4,14,17,20. Gadgets antigos usam 1,2,4,14 — se um
  # número não bater com um gadget, confira o recorte antes de procurar bug.
  codemp: [1, 2, 3, 4, 14, 17, 20]
  excluir_intercompany: true

kpis:

# ---------------------------------------------------------------------------
# COMERCIAL
# ---------------------------------------------------------------------------

- id: faturamento_ritmo
  titulo: Ritmo de faturamento
  pergunta: No ritmo de hoje, bato a meta do mês?
  area: logistica
  sql: sql/faturamento_ritmo.sql
  frequencia: diaria
  horario: "07:30"
  metrica: PCT_PROJECAO_META
  unidade: percentual
  avaliacao:
    tipo: limite_inferior
    verde: 100
    amarelo: 85
    vermelho: 70
  dono: logistica
  canal_teams: logistica
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "Ritmo de faturamento em {valor}% da meta diária"
    passos:
      - "Quanto sai hoje e quanto fica, em R$. Não em número de cargas."
      - "Se a carga não fecha, diga o que falta: doca, veículo, separação ou janela do cliente."
      - "A carteira dá 4 dias de meta e a agenda tem 9 dias ociosos — se não estamos faturando, o que trava é a saída."
      - "Se o gargalo for de outra área (crédito travado, falta de estoque), nomeie e eu cobro lá."
    sla_resposta_horas: 4
  status_dado: validado
  modo: ativo
  observacao: >
    DONO É A EXPEDIÇÃO/FATURAMENTO, não o comercial — definido pela diretoria
    em 22/09/26. Faturar é emitir a nota, e quem emite é quem carrega. O
    comercial responde pela ENTRADA de pedido (pedidos_ritmo) e pela carteira
    atendível (carteira_disponivel_faturar); o que já está vendido e não sai
    pela porta é da expedição.
    A apuração sustenta a decisão: a carteira tem 4 dias de meta com estoque
    na mão e a agenda de carga tem 9 dias ociosos nos próximos 11 agendados.
    Quando o dia não bate a meta, o que falta não é pedido.
    META DIÁRIA DE R$ 500.000 nas empresas 1, 2, 4 e 14 — recorte diferente do
    resto da matriz de propósito: só as que produzem e expedem (fora 3 NTR Log,
    17 Hyak Group, 20 ACIUD). É o mesmo número que limita a agenda de carga,
    e é por isso que os dois KPIs têm o mesmo dono: a fábrica escoa numa
    capacidade só.
    AFERIDO 22/09/26, últimos 63 dias úteis: média R$ 364.278/dia, mediana
    R$ 329.452, e apenas 11 dos 63 dias (17,5%) bateram os R$ 500 mil. A meta
    está 37% acima da média realizada — é escolha de gestão, não erro de
    cálculo, mas o KPI vai ficar vermelho até a operação mudar. Os limiares
    foram afrouxados (85/70 em vez de 92/85) para que "vermelho" continue
    significando alguma coisa.

