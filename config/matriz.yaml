    AFERIDO 22/09/26: 57 produtos inativos com saldo, 304.723 unidades,
    R$ 607.635,72 a custo médio. 8 sem custo cadastrado entram com zero, então
    o valor real é um pouco maior.
    A coluna que separa as duas conversas: inativo que AINDA VENDEU nos
    últimos 180 dias sai com desconto; o que não vendeu nada é decisão de
    baixa, não de promoção. A ação pede as duas listas separadas.
    CUSTO: TGFCUS.CUSMED da última DTATUAL por produto. A tabela é histórica
    (chave com DTATUAL), então sem KEEP DENSE_RANK LAST soma custo de várias
