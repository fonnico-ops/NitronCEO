- id: ciclos_altos
  titulo: Ciclo de injeção acima do padrão
  pergunta: Quanto a injeção está rodando mais devagar do que deveria?
  area: producao
  sql: sql/ciclos_altos.sql
  frequencia: diaria
  horario: "07:30"
  metrica: PCT_MEDIANO
  unidade: percentual
  avaliacao: { tipo: limite_superior, verde: 110, amarelo: 125, vermelho: 140 }
  dono: gerente_producao
  canal_teams: producao
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "Ciclo mediano em {valor}% do padrão de cadastro"
    passos:
      - "Das injetoras da lista: é a máquina, o molde, o material ou quem opera?"
      - "Antes de cobrar o turno, confirme se o ciclo base do cadastro está certo."
      - "A INJETORA 19 é a pior em setup E está entre as piores em ciclo — comece por ela."
      - "Ciclo 28% mais lento é ~22% menos peça por hora. Diga quanto isso custa na programação."
    sla_resposta_horas: 8
  status_dado: validado
  modo: ativo
  observacao: >
    AD_TGPAPO.CICLOREAL (tempo real por tiro) contra CICLOBASE (padrão do par
    produto x injetora). A skill do PCP é explícita: CICLOREAL é a régua
    confiável de ritmo, e NÃO se usa o tempo de parede de AD_APONTACICLO, que
    varia 12x para o mesmo par.
    Ciclo alto é perda de capacidade SILENCIOSA: a máquina está ligada, o
    apontamento acontece, ninguém reclama — e a fábrica entrega menos peça por
    hora do que o plano assumiu. Diferente da parada, que salta aos olhos.
    AFERIDO 22/09/26 (30 dias, 291.427 apontamentos): MEDIANA em 128,5% do
    ciclo base. 146.857 apontamentos acima de +25% e 63.007 acima de +50%.
    Piores: INJETORA 7 (18,0s -> 32,4s, 178%), INJETORA 22 (162%), INJETORA 2
    (160%), INJETORA 44 (155%), INJETORA 9 (154%).
    14.756 apontamentos sem CICLOBASE cadastrado ficam fora do cálculo.
    Usa MEDIANA por máquina com piso de 500 apontamentos: média se move com um
    tiro anômalo, e máquina com 20 apontamentos no mês não sustenta conclusão.
    CUIDADO AO LER: base alta demais no cadastro esconde o problema e base
    baixa demais inventa um. Máquina muito fora da curva pede conferência do
    cadastro antes da cobrança.

