      - "É manutenção preventiva que não foi feita, ou molde no fim da vida?"
      - "Para os reincidentes: reforma, substituição ou aceitar o custo? Escolha."
    sla_resposta_horas: 24
  status_dado: validado
  modo: ativo
  observacao: >
    PRIMEIRO KPI DE PROJETOS/MOLDES. Antes dele o papel existia no cadastro e
    não tinha o que cobrar, porque parada de molde não era medida em lugar
    nenhum vivo. TPRIWC + TPRMTP motivo 6 ("MANUTENÇÃO DE MOLDE",
    MOTIVOPARADA='C' = corretiva) resolveu isso.
