- id: emissao_ntrlog
  titulo: Emissão da NTR Log contra o frete pago
  pergunta: A NTR Log está faturando o frete que a Nitron paga a ela?
  area: logistica
  sql: sql/emissao_ntrlog.sql
  frequencia: mensal
  dia_mes: 5
  horario: "07:00"
  metrica: PCT_COBERTURA
  unidade: percentual
  avaliacao: { tipo: limite_inferior, verde: 90, amarelo: 70, vermelho: 40 }
  dono: logistica
  canal_teams: logistica
  notificar: { verde: [], amarelo: [teams, email], vermelho: [teams, email] }
  acao:
    titulo: "NTR Log emitiu apenas {valor}% do frete que a Nitron pagou"
    passos:
      - "As notas existem e não foram importadas para o ERP, ou não foram emitidas?"
      - "Se não foram importadas: traga a conciliação do mês, frete a frete."
      - "Se não foram emitidas: quem na NTR Log emite, e o que trava a emissão?"
      - "Envolva o financeiro para dimensionar a exposição fiscal acumulada."
      - "O que muda no processo para não repetir no mês que vem."
    sla_resposta_horas: 24
  status_dado: validado
  modo: ativo
  observacao: >
    DONO É A LOGÍSTICA/EXPEDIÇÃO, não o financeiro — definido pela diretoria
    em 22/09/26. A relação com a NTR Log é de transporte: quem contrata o
    frete e recebe o serviço é quem consegue dizer o que foi prestado e
    cobrar a nota. O financeiro entra para dimensionar a exposição fiscal,
    e isso está nos passos da ação.
    NTR Log é CODEMP 3 / CODPARC 65253 — empresa do grupo DENTRO do recorte
    Nitron, e por isso some nas consolidações que eliminam intercompany.
    Aferido 22/09/26, agosto fechado: a Nitron lançou R$ 842.709,40 de frete
    NTR em 636 títulos, com ~97% já BAIXADOS (dinheiro que saiu). A NTR Log
    emitiu R$ 21.567,12 no mesmo mês. Cobertura: 2,6%.
    E dos 4.242 títulos de frete NTR dos últimos 6 meses, ZERO tem NUNOTA
    preenchido — nenhum está amarrado a nota fiscal dentro do ERP.
    O QUE ISTO NÃO PROVA: que a nota não existe. Pode ter sido emitida na
    prefeitura e nunca importada. É exatamente essa a pergunta da ação —
    por isso ela pede a conciliação, não a conclusão.

