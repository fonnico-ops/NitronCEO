  metrica: VLR_CUSTO
  unidade: reais
  avaliacao: { tipo: limite_superior, verde: 250000, amarelo: 600000, vermelho: 1200000 }
  dono: diretor_comercial
  canal_teams: comercial
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "R$ {valor} parados em produto inativo"
    passos:
      - "Os que AINDA VENDEM: qual o desconto e para quem, com data de campanha."
      - "Os SEM VENDA em 180 dias: liquidação, doação ou baixa? Cada um precisa de destino."
      - "Traga o valor que espera recuperar — liquidar a qualquer preço também é perda."
      - "Enquanto isso não sai, está ocupando endereço no CD e travando giro."
    sla_resposta_horas: 48
  status_dado: validado
  modo: ativo
  observacao: >
    Produto com TGFPRO.ATIVO='N' que ainda tem saldo é dinheiro imobilizado em
    algo que a empresa decidiu não vender mais. É diferente de suspenso:
    ATIVO='N' são 1.353 produtos que saíram do cadastro; AD_AG_SUSPENSO='S'
