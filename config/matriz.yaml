- id: performance_representante
  titulo: Performance por representante
  pergunta: Quem está fora do ritmo e há quantos dias?
  area: comercial
  sql: sql/performance_representante.sql
  frequencia: semanal
  dia_semana: seg
  horario: "08:00"
  metrica: QTD_ABAIXO_META
  unidade: contagem
  avaliacao: { tipo: limite_superior, verde: 10, amarelo: 20, vermelho: 28 }
  dono: diretor_comercial
  canal_teams: comercial
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "{valor} representantes abaixo da meta"
    passos:
      - "Para cada nome da lista: plano de recuperação ou data de desligamento."
      - "Não aceito 'vou falar com ele' — quero o que foi combinado e até quando."
    sla_resposta_horas: 24
  status_dado: calibrar
  modo: sombra
  observacao: >
    Roda e dá lista nominal. Aferido 22/09/26 (só TGFVEN.ATIVO='S', piso de
    relevância R$ 5.000 de média 3M): 53 representantes, 26 abaixo de 80% da
    própria média, 16 abaixo de 50%, 7 zerados no mês.
    POR QUE NASCE EM SOMBRA: no mesmo mês o faturamento total projeta 107% da
    média. Metade dos representantes cair enquanto o total sobe é mudança de
    mix (ou meta individual desatualizada), não queda de esforço — cobrar 26
    pessoas com esse número queima a credibilidade da matriz na primeira
    semana. Ativar quando o diretor comercial fixar a meta individual.
    Zero notas sem vendedor atribuído no período — a distorção clássica de
    ranking não está ocorrendo, o que é uma boa notícia.

