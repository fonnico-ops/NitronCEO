  dono: financeiro
  canal_teams: financeiro
  notificar: { verde: [], amarelo: [teams], vermelho: [teams, email] }
  acao:
    titulo: "R$ {valor} vencidos a receber"
    passos:
      - "Top 10 devedores e o estágio de cada cobrança."
